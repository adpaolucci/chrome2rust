[workspace]
resolver = "2"
members = [
    "crates/chrome2rust-core",
    "crates/chrome2rust-cache",
    "crates/chrome2rust-forensics",
    "crates/chrome2rust-report",
    "crates/chrome2rust-mcp",
    "crates/chrome2rust-cli",
    "crates/chrome2rust-gui",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/adpaolucci/chrome2rust"
homepage = "https://chrome2rust.guap.ca"
documentation = "https://chrome2rust.guap.ca"
authors = ["Chrome2Rust Contributors"]
description = "Blazing-fast, memory-safe Google Chrome cache inspection and User Data forensic workstation in 100% pure Rust"
keywords = ["chrome", "forensics", "cache", "mcp", "merkle"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
chrome2rust-core = { path = "crates/chrome2rust-core" }
chrome2rust-cache = { path = "crates/chrome2rust-cache" }
chrome2rust-forensics = { path = "crates/chrome2rust-forensics" }
chrome2rust-report = { path = "crates/chrome2rust-report" }
chrome2rust-mcp = { path = "crates/chrome2rust-mcp" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.34", features = ["bundled"] }
flate2 = "1.1"
brotli = "9.1"
ruzstd = "0.9"
snap = "1.1"
crc32fast = "1.5"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
x509-parser = "0.18"
walkdir = "2.5"
regex = "1.13"
url = "2.5"
csv = "1.4"
dirs = "7.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
tempfile = "3.20"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ctrlc = "3.4"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33", features = ["all_loaders"] }
rfd = "0.17"
arboard = "3.6"

[profile.dev.package.clap]
opt-level = 2

[profile.dev.package.clap_builder]
opt-level = 2

[profile.dev.package.clap_derive]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
